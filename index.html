<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panzerkampfwagen</title>
    <link rel="icon" type="image/x-icon" href="skull.ico">
    <style>
        @font-face {
            font-family: 'Warface';
            src: url('warface.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * { box-sizing: border-box; }

        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Warface', 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        #ribbonCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            z-index: 1;
            cursor: grab;
        }

        #ribbonCanvas:active { cursor: grabbing; }

        h1, .subtitle, #timer, .motivation {
            position: relative;
            z-index: 5;
            pointer-events: none;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 5px;
            color: #ffcc00;
            text-shadow: 3px 3px 0 #000, 0 0 20px rgba(255, 204, 0, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.3rem;
            background-color: #ffcc00;
            color: #000;
            padding: 5px 15px;
            transform: rotate(-1deg);
            box-shadow: 4px 4px 0 #000;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        #timer {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            pointer-events: auto;
        }

        .time-block {
            background: #111;
            padding: 15px 25px;
            border: 3px solid #ffcc00;
            box-shadow: 5px 5px 0 #000;
            min-width: 90px;
            position: relative;
        }

        .time-block::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(255,254,0,0.03) 50%, rgba(0,0,0,0.1) 50%), linear-gradient(90deg, rgba(255,255,255,0.03) 50%, rgba(0,0,0,0.1) 50%);
            background-size: 4px 4px;
            pointer-events: none;
        }

        .time-number {
            font-size: 3.5rem;
            color: #ffcc00;
            display: block;
            text-shadow: 2px 2px 0 #000;
            position: relative;
            z-index: 1;
        }

        .time-label {
            font-size: 0.9rem;
            color: #888;
            text-transform: uppercase;
            margin-top: 5px;
            display: block;
            position: relative;
            z-index: 1;
        }

        .motivation {
            margin-top: 50px;
            font-size: 1.1rem;
            color: #ffcc00;
            max-width: 420px;
            border-left: 4px solid #ffcc00;
            padding-left: 15px;
            text-align: left;
        }

        .contact-block {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 20;
            pointer-events: auto;
        }

        .contact-handle {
            font-family: 'Warface', 'Arial Black', sans-serif;
            color: #ffcc00;
            text-decoration: none;
            text-transform: lowercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 #000;
            transition: opacity 0.2s ease;
            display: inline-block;
            max-width: 100%;
            word-break: break-word;
            font-size: 1.2rem;
        }

        .contact-handle:hover { opacity: 0.9; }

        .drag-tip {
            position: absolute;
            left: calc(50% - 160px);
            top: calc(48% - 389px);
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ff2a2a;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 12;
            pointer-events: none;
            text-shadow: 2px 2px 0 #000;
        }

        .drag-tip .arrow {
            font-size: 2rem;
            line-height: 1;
            color: #ff2a2a;
            display: inline-block;
        }

        @media (max-width: 768px) {
            body { padding: 20px 14px; justify-content: center; }
            h1 { font-size: 2.1rem; line-height: 1.1; max-width: 90vw; }
            .subtitle { font-size: 0.95rem; padding: 6px 12px; }
            #timer { gap: 8px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
            .time-block { min-width: 68px; padding: 10px 12px; box-shadow: 3px 3px 0 #000; }
            .time-number { font-size: 2.1rem; }
            .time-label { font-size: 0.7rem; }
            .motivation { margin-top: 28px; font-size: 0.9rem; max-width: 88vw; }
            .contact-block { margin-top: 14px; gap: 6px; }
            .contact-handle { font-size: 1rem; }
            .drag-tip {
                left: 50%;
                top: 16%;
                transform: translate(-50%, 0);
                font-size: 0.72rem;
                gap: 6px;
            }
            .drag-tip .arrow { font-size: 1.5rem; transform: rotate(-90deg); }
        }
    </style>
</head>
<body>
    <canvas id="ribbonCanvas"></canvas>
    <div class="drag-tip"><span>можно двигать</span><span class="arrow">→</span></div>

    <h1>Ждем лета</h1>
    <div class="subtitle">До летней свободы осталось всего лишь:</div>

    <div id="timer">
        <div class="time-block"><span class="time-number" id="days">00</span><span class="time-label">Дней</span></div>
        <div class="time-block"><span class="time-number" id="hours">00</span><span class="time-label">Часов</span></div>
        <div class="time-block"><span class="time-number" id="minutes">00</span><span class="time-label">Минут</span></div>
        <div class="time-block"><span class="time-number" id="seconds">00</span><span class="time-label">Секунд</span></div>
    </div>

    <div class="motivation" id="phrase">Держитесь, глупцы...</div>

    <div class="contact-block">
        <a class="contact-handle" href="https://t.me/PanzerMausVIII" target="_blank" rel="noopener noreferrer">@Panzerkampfwagen</a>
    </div>

    <script>
        const canvas = document.getElementById('ribbonCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resize();

        const patternCanvas = document.createElement('canvas');
        const stripeWidth = 24;
        patternCanvas.width = stripeWidth * 2;
        patternCanvas.height = stripeWidth * 2;
        const pCtx = patternCanvas.getContext('2d');

        pCtx.fillStyle = '#ffcc00';
        pCtx.fillRect(0, 0, stripeWidth, stripeWidth * 2);
        pCtx.fillStyle = '#000000';
        pCtx.fillRect(stripeWidth, 0, stripeWidth, stripeWidth * 2);

        const stripePattern = ctx.createPattern(patternCanvas, 'repeat');

        const mouse = { x: 0, y: 0, down: false, target: null, segment: 0 };

        class Ribbon {
            constructor({ percentX, widthValue, totalLength, angle, seed }) {
                this.percentX = percentX;
                this.widthValue = widthValue;
                this.totalLength = totalLength;
                this.angle = angle;
                this.seed = seed;
                this.segCount = 12;
                this.segLength = totalLength / this.segCount;
                this.points = [];
                this.generatePoints();
            }

            generatePoints() {
                this.points = [];
                for (let i = 0; i < this.segCount; i++) {
                    const x = width * (this.percentX / 100) + Math.sin((i + this.seed) * 0.9) * (8 + this.widthValue * 0.15);
                    const y = -80 + i * this.segLength + Math.cos(this.seed + i * 0.7) * 10;
                    this.points.push({ x, y, oldX: x, oldY: y });
                }
            }

            update(time) {
                this.points[0].x = width * (this.percentX / 100) + Math.sin(time * 0.001 + this.seed) * 5;
                this.points[0].y = -80;

                for (let i = 1; i < this.points.length; i++) {
                    const p = this.points[i];
                    const vx = (p.x - p.oldX) * 0.94;
                    const vy = (p.y - p.oldY) * 0.94;
                    p.oldX = p.x;
                    p.oldY = p.y;
                    p.x += vx;
                    p.y += vy + 0.55;
                }

                if (mouse.down && mouse.target === this) {
                    const p = this.points[mouse.segment];
                    p.x += (mouse.x - p.x) * 0.18;
                    p.y += (mouse.y - p.y) * 0.18;
                }

                for (let iter = 0; iter < 3; iter++) {
                    for (let i = 0; i < this.points.length - 1; i++) {
                        const p1 = this.points[i];
                        const p2 = this.points[i + 1];
                        const dx = p2.x - p1.x;
                        const dy = p2.y - p1.y;
                        const dist = Math.hypot(dx, dy) || 1;
                        const diff = (this.segLength - dist) / dist * 0.5;
                        const offsetX = dx * diff;
                        const offsetY = dy * diff;

                        if (i > 0) {
                            p1.x -= offsetX;
                            p1.y -= offsetY;
                        }
                        p2.x += offsetX;
                        p2.y += offsetY;
                    }
                }
            }

            draw() {
                const len = this.points.length;
                const left = new Array(len);
                const right = new Array(len);
                const half = this.widthValue / 2;

                for (let i = 0; i < len; i++) {
                    const p = this.points[i];
                    const prev = this.points[i > 0 ? i - 1 : 0];
                    const next = this.points[i < len - 1 ? i + 1 : i];
                    const dx = next.x - prev.x;
                    const dy = next.y - prev.y;
                    const dLen = Math.hypot(dx, dy) || 1;
                    const nx = (-dy / dLen) * half;
                    const ny = (dx / dLen) * half;

                    left[i] = { x: p.x + nx, y: p.y + ny };
                    right[len - 1 - i] = { x: p.x - nx, y: p.y - ny };
                }

                const pA = left[len - 1];
                const pB = right[0];
                const baseLen = Math.hypot(pB.x - pA.x, pB.y - pA.y) || 1;
                const ux = (pB.x - pA.x) / baseLen;
                const uy = (pB.y - pA.y) / baseLen;

                ctx.beginPath();
                ctx.moveTo(left[0].x, left[0].y);

                for (let i = 1; i < len; i++) {
                    ctx.lineTo(left[i].x, left[i].y);
                }

                for (let i = 1; i <= 8; i++) {
                    const t = i / 9;
                    const x = pA.x + (pB.x - pA.x) * t;
                    const y = pA.y + (pB.y - pA.y) * t;
                    const wave = Math.sin((i + this.seed) * 1.8) * (18 * (1 - t));
                    ctx.lineTo(x + uy * wave, y - ux * wave);
                }

                for (let i = 0; i < len; i++) {
                    ctx.lineTo(right[i].x, right[i].y);
                }

                ctx.closePath();

                const start = this.points[0];
                const end = this.points[len - 1];
                const angle = Math.atan2(end.y - start.y, end.x - start.x);

                ctx.save();
                ctx.clip();
                ctx.translate((start.x + end.x) / 2, (start.y + end.y) / 2);
                ctx.rotate(angle + Math.PI / 4);

                ctx.fillStyle = stripePattern;
                ctx.fillRect(-1000, -1000, 2000, 2000);

                ctx.restore();
            }
        }

        let ribbons = [];

        function initRibbons() {
            const mobile = window.innerWidth < 768;
            const config = mobile ? [
                { percentX: 8, widthValue: 26, totalLength: 150, angle: 28, seed: 0.8 },
                { percentX: 28, widthValue: 42, totalLength: 200, angle: 20, seed: 1.7 },
                { percentX: 50, widthValue: 32, totalLength: 140, angle: 24, seed: 2.6 },
                { percentX: 72, widthValue: 50, totalLength: 220, angle: 18, seed: 3.9 },
                { percentX: 92, widthValue: 28, totalLength: 170, angle: 30, seed: 5.2 }
            ] : [
                { percentX: 8, widthValue: 44, totalLength: 240, angle: 28, seed: 0.8 },
                { percentX: 28, widthValue: 70, totalLength: 330, angle: 20, seed: 1.7 },
                { percentX: 50, widthValue: 54, totalLength: 220, angle: 24, seed: 2.6 },
                { percentX: 72, widthValue: 82, totalLength: 390, angle: 18, seed: 3.9 },
                { percentX: 92, widthValue: 48, totalLength: 280, angle: 30, seed: 5.2 }
            ];

            ribbons = config.map(item => new Ribbon(item));
        }

        initRibbons();

        function handleStart(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            mouse.x = clientX - rect.left;
            mouse.y = clientY - rect.top;
            mouse.down = true;

            let minDist = Infinity;
            ribbons.forEach((ribbon) => {
                ribbon.points.forEach((point, index) => {
                    const dist = Math.hypot(point.x - mouse.x, point.y - mouse.y);
                    if (dist < minDist && dist < 60) {
                        minDist = dist;
                        mouse.target = ribbon;
                        mouse.segment = index;
                    }
                });
            });
        }

        function handleMove(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            mouse.x = clientX - rect.left;
            mouse.y = clientY - rect.top;
        }

        canvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', e => {
            if (e.touches.length) handleStart(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
        window.addEventListener('touchmove', e => {
            if (e.touches.length) handleMove(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        window.addEventListener('mouseup', () => { mouse.down = false; mouse.target = null; });
        window.addEventListener('touchend', () => { mouse.down = false; mouse.target = null; });

        window.addEventListener('resize', () => {
            resize();
            initRibbons();
        });

        function drawLoop(time) {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < ribbons.length; i++) {
                ribbons[i].update(time);
                ribbons[i].draw();
            }
            requestAnimationFrame(drawLoop);
        }

        requestAnimationFrame(drawLoop);

        const elDays = document.getElementById('days');
        const elHours = document.getElementById('hours');
        const elMinutes = document.getElementById('minutes');
        const elSeconds = document.getElementById('seconds');
        const elPhrase = document.getElementById('phrase');

        const phrases = [
            'Каждый звонок приближает нас к лету... Или к отчислению.',
            'Терпение — твой главный скилл на этот год.',
            'Помним, любим, скорбим по теплым дням.',
            'Не плачь, потому что это началось. Улыбнись, потому что... ладно, плачь.',
            'Главное — пережить зиму, дальше проще.'
        ];

        elPhrase.textContent = phrases[Math.floor(Math.random() * phrases.length)];

        function updateTimer() {
            const currentYear = new Date().getFullYear();
            const nextSummer = new Date(currentYear + 1, 5, 1, 0, 0, 0).getTime();
            const difference = nextSummer - Date.now();

            if (difference <= 0) {
                elDays.textContent = '00';
                elHours.textContent = '00';
                elMinutes.textContent = '00';
                elSeconds.textContent = '00';
                elPhrase.textContent = 'Лето пришло!';
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            elDays.textContent = String(days).padStart(2, '0');
            elHours.textContent = String(hours).padStart(2, '0');
            elMinutes.textContent = String(minutes).padStart(2, '0');
            elSeconds.textContent = String(seconds).padStart(2, '0');
        }

        updateTimer();
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
